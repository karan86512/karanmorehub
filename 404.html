<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:linear-gradient(135deg,#f8fbff,#eef5ff);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

color:#1e293b;

}

.card{

max-width:700px;

width:100%;

background:#fff;

border-radius:25px;

padding:60px 40px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.08);

animation:fadeUp .8s ease;

}

.error{

font-size:110px;

font-weight:800;

color:#2563eb;

line-height:1;

}

h1{

margin:20px 0;

font-size:36px;

}

p{

font-size:18px;

color:#64748b;

line-height:1.8;

margin-bottom:35px;

}

.btn{

display:inline-block;

padding:14px 32px;

background:#2563eb;

color:#fff;

text-decoration:none;

border-radius:50px;

font-weight:600;

transition:.3s;

}

.btn:hover{

background:#1d4ed8;

transform:translateY(-3px);

}

.links{

margin-top:35px;

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;

}

.links a{

text-decoration:none;

color:#2563eb;

font-weight:600;

}

.links a:hover{

text-decoration:underline;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:768px){

.error{

font-size:80px;

}

h1{

font-size:28px;

}

p{

font-size:16px;

}

.card{

padding:40px 25px;

}

}

</style>
